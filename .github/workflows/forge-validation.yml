name: Tests Fitness RPG

on:
  push:
    branches: [main, revision-forge-intermediaire-20261119]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les fichiers JavaScript
        run: |
          for file in app-*.js app.js service-worker.js; do node --check "$file"; done
          node --check scripts/check-version-bump.cjs
      - name: Exécuter les tests Node.js
        run: node --test tests/*.test.cjs

      - name: Contrôler l'incrément de version des livraisons
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          node scripts/check-version-bump.cjs "$BASE_SHA"
