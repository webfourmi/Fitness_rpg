name: V6.1A Mobile First

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v61a-mobile-first.yml

permissions:
  contents: write

jobs:
  apply-v61a:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V6.1A mobile-first changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start_index] + replacement.rstrip() + "\n\n" + text[end_index:]

          # ------------------------------------------------------
          # index.html
          # ------------------------------------------------------
          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = replace_once(index, "Fitness RPG - V6.0B", "Fitness RPG - V6.1A", "index version comment")
          index = index.replace("6.0d", "6.1a")

          mobile_markup = r'''
              <button
                id="mobileMoreBackdrop"
                class="mobile-more-backdrop hidden"
                type="button"
                aria-label="Fermer le menu Plus"
              ></button>

              <section
                id="mobileMorePanel"
                class="mobile-more-panel hidden"
                aria-hidden="true"
                aria-label="Autres destinations"
              >
                <header class="mobile-more-heading">
                  <div>
                    <p class="eyebrow">Navigation</p>
                    <h2>Plus d’options</h2>
                  </div>
                  <button id="closeMobileMoreButton" class="icon-button" type="button" aria-label="Fermer">×</button>
                </header>

                <div class="mobile-more-grid">
                  <button type="button" data-mobile-destination="goal">🎯<span>Objectif</span></button>
                  <button type="button" data-mobile-destination="progression">🏆<span>Progression</span></button>
                  <button type="button" data-mobile-destination="statistics">📊<span>Statistiques</span></button>
                  <button type="button" data-mobile-destination="badges">🏅<span>Badges</span></button>
                  <button type="button" data-mobile-destination="familiars">🐾<span>Familiers</span></button>
                  <button type="button" data-mobile-destination="journal">📖<span>Journal</span></button>
                  <button type="button" data-mobile-destination="hero-menu">🧬<span>Héros</span></button>
                  <button type="button" data-mobile-destination="coach">🧙<span>Coach</span></button>
                  <button type="button" data-mobile-destination="weight">⚖️<span>Poids</span></button>
                  <button type="button" data-mobile-destination="music">🎵<span>Musique</span></button>
                  <button type="button" data-mobile-destination="backup">💾<span>Sauvegarde</span></button>
                </div>
              </section>

              <nav
                id="mobilePrimaryNav"
                class="mobile-primary-nav hidden"
                aria-label="Navigation principale mobile"
              >
                <button id="mobileNavTrainingButton" type="button" data-mobile-destination="training">
                  <span aria-hidden="true">🛡️</span><small>Quête</small>
                </button>
                <button id="mobileNavExercisesButton" type="button" data-mobile-destination="exercises">
                  <span aria-hidden="true">⚔️</span><small>Exercices</small>
                </button>
                <button id="mobileNavProgramsButton" type="button" data-mobile-destination="programs">
                  <span aria-hidden="true">📜</span><small>Programmes</small>
                </button>
                <button id="mobileNavPlanningButton" type="button" data-mobile-destination="planning">
                  <span aria-hidden="true">📅</span><small>Planning</small>
                </button>
                <button
                  id="mobileNavMoreButton"
                  type="button"
                  aria-expanded="false"
                  aria-controls="mobileMorePanel"
                >
                  <span aria-hidden="true">☰</span><small>Plus</small>
                </button>
              </nav>

          '''

          image_overlay_marker = '    <div id="imageOverlay" class="image-overlay hidden" aria-hidden="true">'
          if "mobilePrimaryNav" not in index:
              index = replace_once(
                  index,
                  image_overlay_marker,
                  mobile_markup + image_overlay_marker,
                  "mobile navigation insertion"
              )
          index_path.write_text(index, encoding="utf-8")

          # ------------------------------------------------------
          # app-config.js
          # ------------------------------------------------------
          config_path = Path("app-config.js")
          config = config_path.read_text(encoding="utf-8")
          config = replace_once(config, 'version: "0.6.0-d"', 'version: "0.6.1-a"', "technical version")
          config = replace_once(config, 'displayVersion: "V6.0D"', 'displayVersion: "V6.1A"', "display version")
          config = replace_once(config, 'assetVersion: "6.0d"', 'assetVersion: "6.1a"', "asset version")
          config_path.write_text(config, encoding="utf-8")

          # ------------------------------------------------------
          # app-render.js
          # ------------------------------------------------------
          render_path = Path("app-render.js")
          render = render_path.read_text(encoding="utf-8")

          render_pages = r'''window.FitnessRpgRender.renderPages = function renderPages() {
            const currentPage = window.FitnessRpgState.getPage?.() || "home";
            const hasProfile = Boolean(window.FitnessRpgState.hasProfile?.());

            document.body.dataset.page = currentPage;

            document.querySelectorAll(".app-page").forEach((page) => {
              page.classList.toggle("hidden", page.dataset.page !== currentPage);
            });

            const header = document.querySelector("#appHeader");
            if (header) header.classList.remove("hidden");

            const homeButton = document.querySelector("#homeButton");
            const backButton = document.querySelector("#backButton");
            const headerProgramsButton = document.querySelector("#headerProgramsButton");
            const headerGoalButton = document.querySelector("#headerGoalButton");
            const headerPlanningButton = document.querySelector("#headerPlanningButton");
            const hideHeaderActions = currentPage === "home";

            homeButton?.classList.toggle("hidden", hideHeaderActions);
            backButton?.classList.toggle("hidden", hideHeaderActions);
            headerProgramsButton?.classList.toggle("hidden", hideHeaderActions);
            headerGoalButton?.classList.toggle("hidden", hideHeaderActions);
            headerPlanningButton?.classList.toggle("hidden", hideHeaderActions);

            window.FitnessRpgNavigation?.closeMobileMorePanel?.({
              restoreFocus: false
            });

            const mobileNav = document.querySelector("#mobilePrimaryNav");
            const showMobileNav = hasProfile && !["home", "hero-setup"].includes(currentPage);
            mobileNav?.classList.toggle("hidden", !showMobileNav);

            const activeDestination = {
              training: "training",
              exercises: "exercises",
              programs: "programs",
              planning: "planning"
            }[currentPage] || "more";

            const mobileButtons = {
              training: document.querySelector("#mobileNavTrainingButton"),
              exercises: document.querySelector("#mobileNavExercisesButton"),
              programs: document.querySelector("#mobileNavProgramsButton"),
              planning: document.querySelector("#mobileNavPlanningButton"),
              more: document.querySelector("#mobileNavMoreButton")
            };

            Object.entries(mobileButtons).forEach(([destination, button]) => {
              if (!button) return;

              const isActive = showMobileNav && destination === activeDestination;
              button.classList.toggle("active", isActive);

              if (isActive) {
                button.setAttribute("aria-current", "page");
              } else {
                button.removeAttribute("aria-current");
              }
            });
          };'''

          render = replace_between(
              render,
              "window.FitnessRpgRender.renderPages = function renderPages() {",
              "window.FitnessRpgRender.renderVersion = function renderVersion() {",
              render_pages,
              "renderPages"
          )
          render_path.write_text(render, encoding="utf-8")

          # ------------------------------------------------------
          # app-navigation.js
          # ------------------------------------------------------
          navigation_path = Path("app-navigation.js")
          navigation = navigation_path.read_text(encoding="utf-8")

          mobile_helpers = r'''window.FitnessRpgNavigation.closeMobileMorePanel = function closeMobileMorePanel(options = {}) {
            const panel = document.querySelector("#mobileMorePanel");
            const backdrop = document.querySelector("#mobileMoreBackdrop");
            const moreButton = document.querySelector("#mobileNavMoreButton");
            const wasOpen = Boolean(panel && !panel.classList.contains("hidden"));

            panel?.classList.add("hidden");
            panel?.setAttribute("aria-hidden", "true");
            backdrop?.classList.add("hidden");
            moreButton?.setAttribute("aria-expanded", "false");

            if (wasOpen && options.restoreFocus !== false) {
              moreButton?.focus?.();
            }
          };

          window.FitnessRpgNavigation.toggleMobileMorePanel = function toggleMobileMorePanel() {
            const panel = document.querySelector("#mobileMorePanel");
            const backdrop = document.querySelector("#mobileMoreBackdrop");
            const moreButton = document.querySelector("#mobileNavMoreButton");

            if (!panel || !backdrop || !moreButton) return;

            const willOpen = panel.classList.contains("hidden");

            panel.classList.toggle("hidden", !willOpen);
            panel.setAttribute("aria-hidden", String(!willOpen));
            backdrop.classList.toggle("hidden", !willOpen);
            moreButton.setAttribute("aria-expanded", String(willOpen));

            if (willOpen) {
              panel.querySelector("button")?.focus?.();
            }
          };

          window.FitnessRpgNavigation.openMobileDestination = function openMobileDestination(destination) {
            const routes = {
              training: () => window.FitnessRpgNavigation.goTraining(),
              exercises: () => window.FitnessRpgNavigation.openExercises(),
              programs: () => window.FitnessRpgNavigation.openPrograms(),
              planning: () => window.FitnessRpgNavigation.openPlanning(),
              goal: () => window.FitnessRpgNavigation.openGoal(),
              progression: () => window.FitnessRpgNavigation.openProgression(),
              statistics: () => window.FitnessRpgNavigation.openStatistics(),
              badges: () => window.FitnessRpgNavigation.openBadges(),
              familiars: () => window.FitnessRpgNavigation.openFamiliars(),
              journal: () => window.FitnessRpgNavigation.openJournal(),
              "hero-menu": () => window.FitnessRpgNavigation.openHeroMenu(),
              coach: () => window.FitnessRpgNavigation.openCoach(),
              weight: () => window.FitnessRpgNavigation.openWeight(),
              music: () => window.FitnessRpgNavigation.openMusic(),
              backup: () => window.FitnessRpgNavigation.openBackup()
            };

            const route = routes[destination];
            if (!route) return;

            window.FitnessRpgNavigation.closeMobileMorePanel({
              restoreFocus: false
            });
            route();
          };

          '''

          navigation_marker = "// ============================================================\n// Navigation principale\n// ============================================================\n"
          if "closeMobileMorePanel" not in navigation:
              navigation = replace_once(
                  navigation,
                  navigation_marker,
                  mobile_helpers + navigation_marker,
                  "mobile navigation helpers"
              )

          click_marker = '''if (window.FitnessRpgNavigation.handlePlanningClick(event, target)) return;
            // Header'''

          mobile_clicks = r'''if (window.FitnessRpgNavigation.handlePlanningClick(event, target)) return;

            const mobileDestinationButton = target.closest("[data-mobile-destination]");

            if (mobileDestinationButton) {
              window.FitnessRpgNavigation.stopEvent(event);
              window.FitnessRpgNavigation.openMobileDestination(
                mobileDestinationButton.dataset.mobileDestination
              );
              return;
            }

            if (target.closest("#mobileNavMoreButton")) {
              window.FitnessRpgNavigation.stopEvent(event);
              window.FitnessRpgNavigation.toggleMobileMorePanel();
              return;
            }

            if (
              target.closest("#mobileMoreBackdrop")
              || target.closest("#closeMobileMoreButton")
            ) {
              window.FitnessRpgNavigation.stopEvent(event);
              window.FitnessRpgNavigation.closeMobileMorePanel();
              return;
            }

            // Header'''

          navigation = replace_once(
              navigation,
              click_marker,
              mobile_clicks,
              "mobile click routing"
          )

          escape_old = '''  if (event.key === "Escape") {
              window.FitnessRpgRender?.closeModal?.();
              return;
            }'''
          escape_new = '''  if (event.key === "Escape") {
              window.FitnessRpgNavigation.closeMobileMorePanel({
                restoreFocus: false
              });
              window.FitnessRpgRender?.closeModal?.();
              return;
            }'''
          navigation = replace_once(navigation, escape_old, escape_new, "escape handling")
          navigation_path.write_text(navigation, encoding="utf-8")

          # ------------------------------------------------------
          # app-v5.css
          # ------------------------------------------------------
          css_path = Path("app-v5.css")
          css = css_path.read_text(encoding="utf-8")
          css = replace_once(css, "Version V6.0D", "Version V6.1A", "css version")
          css = replace_once(
              css,
              "  padding-bottom: 92px;",
              "  padding-bottom: calc(94px + env(safe-area-inset-bottom, 0px));",
              "page bottom spacing"
          )

          mobile_base = r'''
          .mobile-primary-nav,
          .mobile-more-panel,
          .mobile-more-backdrop {
            display: none;
          }

          '''

          desktop_marker = "@media (min-width: 760px) {"
          if ".mobile-primary-nav," not in css:
              css = replace_once(
                  css,
                  desktop_marker,
                  mobile_base + desktop_marker,
                  "mobile navigation base styles"
              )

          mobile_rules = r'''  .app-shell {
              padding-inline: 8px;
            }

            .app-page {
              gap: 10px;
            }

            .app-header {
              min-height: 54px;
              margin-bottom: 10px;
              padding: 7px 8px;
              border-radius: 0 0 16px 16px;
            }

            .app-version-badge {
              max-width: 116px;
              min-height: 28px;
              padding: 5px 8px;
              font-size: 0.62rem;
            }

            #headerProgramsButton,
            #headerGoalButton,
            #headerPlanningButton {
              display: none !important;
            }

            .mobile-primary-nav:not(.hidden) {
              position: fixed;
              left: max(8px, env(safe-area-inset-left, 0px));
              right: max(8px, env(safe-area-inset-right, 0px));
              bottom: max(8px, env(safe-area-inset-bottom, 0px));
              z-index: 94;

              display: grid;
              grid-template-columns: repeat(5, minmax(0, 1fr));
              gap: 5px;

              min-height: 68px;
              padding: 7px;

              border: 1px solid rgba(241, 201, 104, 0.24);
              border-radius: 20px;
              background: rgba(10, 14, 24, 0.94);
              backdrop-filter: blur(18px) saturate(1.18);
              box-shadow: 0 18px 46px rgba(0, 0, 0, 0.48);
            }

            .mobile-primary-nav button {
              display: grid;
              place-items: center;
              align-content: center;
              gap: 3px;

              min-width: 0;
              min-height: 52px;
              padding: 4px 2px;

              border: 1px solid transparent;
              border-radius: 14px;
              background: transparent;
              color: var(--text-muted);
              box-shadow: none;
            }

            .mobile-primary-nav button > span {
              font-size: 1.12rem;
              line-height: 1;
            }

            .mobile-primary-nav button small {
              max-width: 100%;
              overflow: hidden;
              color: inherit;
              font-size: 0.61rem;
              font-weight: 850;
              line-height: 1;
              text-overflow: ellipsis;
              white-space: nowrap;
            }

            .mobile-primary-nav button.active {
              border-color: rgba(241, 201, 104, 0.4);
              background: var(--accent-soft);
              color: var(--accent-strong);
            }

            .mobile-more-backdrop:not(.hidden) {
              position: fixed;
              inset: 0;
              z-index: 91;
              display: block;
              width: 100%;
              height: 100%;
              min-height: 100dvh;
              padding: 0;
              border: 0;
              border-radius: 0;
              background: rgba(3, 6, 12, 0.68);
              backdrop-filter: blur(5px);
            }

            .mobile-more-panel:not(.hidden) {
              position: fixed;
              left: max(8px, env(safe-area-inset-left, 0px));
              right: max(8px, env(safe-area-inset-right, 0px));
              bottom: calc(84px + env(safe-area-inset-bottom, 0px));
              z-index: 93;

              display: grid;
              gap: 10px;
              max-height: min(68dvh, 560px);
              overflow-y: auto;
              padding: 12px;

              border: 1px solid rgba(124, 200, 255, 0.28);
              border-radius: 20px;
              background: rgba(18, 24, 40, 0.98);
              box-shadow: 0 24px 64px rgba(0, 0, 0, 0.56);
            }

            .mobile-more-heading {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 10px;
            }

            .mobile-more-heading h2 {
              margin: 5px 0 0;
              font-size: 1.1rem;
            }

            .mobile-more-grid {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 7px;
            }

            .mobile-more-grid button {
              display: grid;
              place-items: center;
              gap: 4px;
              min-width: 0;
              min-height: 64px;
              padding: 7px 4px;
              border-color: rgba(255, 255, 255, 0.1);
              background: rgba(255, 255, 255, 0.045);
              color: var(--text);
              font-size: 1.08rem;
            }

            .mobile-more-grid button span {
              max-width: 100%;
              overflow: hidden;
              font-size: 0.65rem;
              font-weight: 850;
              text-overflow: ellipsis;
              white-space: nowrap;
            }

            .card,
            .panel,
            .program-card,
            .program-detail,
            .program-detail-card,
            .program-week-card,
            .program-day-card,
            .program-session-card,
            .program-boss-card,
            .boss-card,
            .week-card,
            .planning-card,
            .planning-summary,
            .today-planning-card,
            .planning-week-progress,
            .exercise-card,
            .badge-card,
            .goal-choice-card,
            .reward-familiar-card {
              padding: 11px;
              border-radius: 16px;
              box-shadow: 0 8px 22px rgba(0, 0, 0, 0.2);
            }

            .page-header {
              padding: 12px;
            }

            .page-header h1 {
              margin-bottom: 6px;
              font-size: 1.38rem;
            }

            .page-header p {
              font-size: 0.82rem;
              line-height: 1.35;
            }

            .program-list,
            .exercise-list,
            .badge-list,
            .program-choice-grid,
            .program-days,
            .program-session-list {
              gap: 8px;
            }

            .program-card {
              grid-template-columns: 38px minmax(0, 1fr);
              gap: 8px;
              padding: 9px;
            }

            .program-icon {
              width: 38px;
              height: 38px;
              border-radius: 12px;
              font-size: 1.1rem;
            }

            .program-list .program-card ul {
              display: none;
            }

            .program-card p {
              font-size: 0.8rem;
            }

            .training-toolbar {
              padding: 0;
              border: 0;
              background: transparent;
              box-shadow: none;
            }

            .training-tool-group {
              padding: 9px;
              border-radius: 16px;
            }

            .training-toolbar button {
              min-height: 58px;
            }

            .today-card {
              padding: 12px;
            }

          '''

          mobile_marker = "@media (max-width: 699px) {\n"
          if "mobile-primary-nav:not(.hidden)" not in css:
              css = replace_once(
                  css,
                  mobile_marker,
                  mobile_marker + mobile_rules,
                  "mobile responsive styles"
              )

          css_path.write_text(css, encoding="utf-8")

          # ------------------------------------------------------
          # Integrity checks
          # ------------------------------------------------------
          index_check = index_path.read_text(encoding="utf-8")
          required_ids = [
              "mobilePrimaryNav",
              "mobileMorePanel",
              "mobileMoreBackdrop",
              "mobileNavTrainingButton",
              "mobileNavExercisesButton",
              "mobileNavProgramsButton",
              "mobileNavPlanningButton",
              "mobileNavMoreButton"
          ]

          for element_id in required_ids:
              count = index_check.count(f'id="{element_id}"')
              if count != 1:
                  raise SystemExit(f"{element_id}: expected exactly once, found {count}")

          workflow_path = Path(".github/workflows/v61a-mobile-first.yml")
          workflow_path.unlink()
          PY

      - name: Check JavaScript syntax
        run: |
          node --check app-config.js
          node --check app-render.js
          node --check app-navigation.js

      - name: Verify scope and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v5.css app-render.js app-navigation.js app-config.js .github/workflows/v61a-mobile-first.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/v61a-mobile-first.yml app-config.js app-navigation.js app-render.js app-v5.css index.html | sort)"
          test "$changed" = "$expected"
          git commit -m "V6.1A: optimiser les cartes et la navigation mobile"
          git push
