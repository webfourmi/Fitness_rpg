name: V5.4 Step 4 Exercise Card

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v54-step4-card.yml

permissions:
  contents: write

jobs:
  apply-step-4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify exercise card renderers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_between(path, start, end, replacement):
              file_path = Path(path)
              content = file_path.read_text(encoding="utf-8")

              start_index = content.index(start)
              end_index = content.index(end, start_index)

              updated = (
                  content[:start_index]
                  + replacement.rstrip()
                  + "\n\n"
                  + content[end_index:]
              )

              file_path.write_text(updated, encoding="utf-8")

          exercise_card = r'''window.FitnessRpgExercises.exerciseCardHtml = function exerciseCardHtml(exercise, options = {}) {
            if (!exercise) return "";

            const item = options.item || {};
            const isProgramCard = options.mode === "program";
            const exerciseId = exercise.id || item.exerciseId || "";
            const exerciseKey = options.exerciseKey || "";

            const title = window.FitnessRpgExercises.escapeHtml(
              exercise.title || item.exerciseId || "Exercice"
            );
            const phase = window.FitnessRpgExercises.escapeHtml(item.phase || "");
            const stat = window.FitnessRpgExercises.escapeHtml(exercise.stat || "");
            const amount = isProgramCard ? item.amount : exercise.defaultValue;
            const unit = isProgramCard ? item.unit : exercise.unit;
            const safeAmount = window.FitnessRpgExercises.escapeHtml(amount ?? "");
            const safeUnit = window.FitnessRpgExercises.escapeHtml(unit || "");
            const safeExerciseId = window.FitnessRpgExercises.escapeHtml(exerciseId);
            const safeExerciseKey = window.FitnessRpgExercises.escapeHtml(exerciseKey);

            const image = window.FitnessRpgExercises.getSafeExerciseImage(exercise);
            const color = window.FitnessRpgExercises.getCategoryColor(exercise.categoryId);
            const icon = window.FitnessRpgExercises.getCategoryIcon(exercise.categoryId);
            const category = window.FitnessRpgExercises.getCategory(exercise.categoryId);

            const articleClasses = [
              "exercise-card",
              "v3-exercise-card",
              isProgramCard ? "program-session-exercise" : "",
              isProgramCard ? "v3-program-exercise-card" : "",
              options.done ? "done" : ""
            ].filter(Boolean).join(" ");

            const imageClasses = [
              "exercise-image-button",
              "v3-exercise-image-button",
              isProgramCard ? "v3-program-exercise-image" : ""
            ].filter(Boolean).join(" ");

            const indexHtml = isProgramCard
              ? `<div class="program-session-index">${Number(options.index || 0) + 1}</div>`
              : "";

            const standaloneTitleHtml = isProgramCard
              ? ""
              : `<h3 class="v3-exercise-title">${title}</h3>`;

            const distanceField = !isProgramCard && exercise.hasDistance
              ? `
                <label class="distance-inline-label exercise-top-input">
                  <span>km</span>
                  <input
                    class="exercise-distance-input"
                    data-exercise-id="${safeExerciseId}"
                    type="number"
                    min="0"
                    step="0.1"
                    value="0"
                  >
                </label>
              `
              : "";

            const topControlsHtml = isProgramCard
              ? ""
              : `
                <div class="exercise-top-controls">
                  <label class="amount-inline-label exercise-top-input">
                    <span>${window.FitnessRpgExercises.shortUnit(exercise.unit)}</span>
                    <input
                      class="exercise-amount-input"
                      data-exercise-id="${safeExerciseId}"
                      type="number"
                      min="${Number(exercise.min || 1)}"
                      step="${Number(exercise.step || 1)}"
                      value="${Number(exercise.defaultValue || exercise.min || 1)}"
                    >
                  </label>
                  ${distanceField}
                </div>
              `;

            const timerButton = !isProgramCard && exercise.hasTimer
              ? `
                <button
                  class="secondary-btn start-timer-btn"
                  type="button"
                  data-exercise-id="${safeExerciseId}"
                  aria-label="Démarrer le timer"
                  title="Démarrer"
                >
                  <span class="exercise-action-icon" aria-hidden="true">▶️</span>
                </button>
              `
              : "";

            const standaloneActionsHtml = isProgramCard
              ? ""
              : `
                <div class="exercise-control-row">
                  ${timerButton}
                  <button
                    class="primary-btn validate-exercise-btn"
                    type="button"
                    data-exercise-id="${safeExerciseId}"
                    aria-label="Valider l’exercice"
                    title="Valider"
                  >
                    <span class="exercise-action-icon" aria-hidden="true">✅</span>
                  </button>
                </div>
              `;

            const programBodyHtml = isProgramCard
              ? `
                <strong>${phase}</strong>
                <h3>${title}</h3>
                <p>
                  ${icon} ${window.FitnessRpgExercises.escapeHtml(category?.title || "Exercice")}
                  · ${safeAmount} ${safeUnit}
                </p>
              `
              : `<p class="exercise-stat">${icon} ${stat}</p>`;

            const actionWrapperHtml = isProgramCard
              ? (
                  options.actionsHtml
                    ? `<div class="program-session-actions">${options.actionsHtml}</div>`
                    : ""
                )
              : standaloneActionsHtml;

            const bodyClass = isProgramCard
              ? "exercise-card-body v3-program-exercise-body"
              : "exercise-card-body";

            const keyAttribute = safeExerciseKey
              ? ` data-exercise-key="${safeExerciseKey}"`
              : "";

            return `
              <article
                class="${articleClasses}"
                data-exercise-id="${safeExerciseId}"
                ${keyAttribute}
                style="--category-color:${color}"
              >
                ${indexHtml}
                ${standaloneTitleHtml}
                ${topControlsHtml}

                <button
                  class="${imageClasses}"
                  type="button"
                  data-exercise-id="${safeExerciseId}"
                  ${keyAttribute}
                  title="Voir l’explication"
                >
                  <img
                    src="${image}"
                    alt="${title}"
                    onerror="this.onerror=null;this.src=window.FitnessRpgExercises.getDefaultExerciseImage()"
                  >
                </button>

                <div class="${bodyClass}">
                  ${programBodyHtml}
                  ${actionWrapperHtml}
                </div>
              </article>
            `;
          };'''

          program_wrapper = r'''window.FitnessRpgExercises.programExerciseCardHtml = function programExerciseCardHtml(item, index, options = {}) {
            if (!item?.exerciseId) return "";

            const exercise = window.FitnessRpgExercises.getExercise(item.exerciseId);
            const safeExercise = exercise || {
              id: item.exerciseId,
              title: item.exerciseId,
              categoryId: "warmup",
              unit: item.unit,
              defaultValue: item.amount,
              min: 1,
              step: 1
            };

            return window.FitnessRpgExercises.exerciseCardHtml(safeExercise, {
              mode: "program",
              item,
              index,
              done: Boolean(options.done),
              actionsHtml: options.actionsHtml || "",
              exerciseKey: options.exerciseKey || `${index}-${item.exerciseId}`
            });
          };'''

          render_active_session = r'''window.FitnessRpgRender.renderActiveProgramSession = function renderActiveProgramSession() {
            const detail = document.querySelector("#programDetail");
            const session = window.FitnessRpgState.getActiveProgramSession?.();

            if (!detail || !session) return;

            const program = window.FitnessRpgConfig.getProgramById(session.programId);
            const workout = window.FitnessRpgPrograms.getActiveProgramWorkout?.(session);
            const exercises = Array.isArray(workout?.exercises) ? workout.exercises : [];

            if (!program || !workout || !exercises.length) return;

            const isBoss = session.type === "program-boss";
            const complete = window.FitnessRpgState.isProgramSessionComplete();

            const xp = isBoss
              ? Number(workout.xp || workout.boss?.xp || 50)
              : (
                  window.FitnessRpgProgress.calculateProgramSessionXp
                    ? window.FitnessRpgProgress.calculateProgramSessionXp(
                        session.programId,
                        session.dayNumber,
                        session.weekNumber || 1
                      )
                    : Number(workout.xp || 20)
                );

            const completedKeys = window.FitnessRpgPrograms.getCompletedExerciseKeys?.(session) || [];
            const totalCount = exercises.length;
            const doneCount = Math.min(
              totalCount,
              window.FitnessRpgState.getProgramSessionCompletedCount?.() || 0
            );

            const currentIndex = exercises.findIndex((item, index) => {
              const key = `${index}-${item.exerciseId}`;
              return !completedKeys.includes(key) && !completedKeys.includes(item.exerciseId);
            });

            const activeIndex = currentIndex >= 0 ? currentIndex : totalCount - 1;
            const activeItem = exercises[activeIndex];
            const activeExercise = window.FitnessRpgExercises.getExercise?.(activeItem.exerciseId);
            const activeExerciseKey = `${activeIndex}-${activeItem.exerciseId}`;
            const activeDone = window.FitnessRpgState.isProgramSessionExerciseDone(activeExerciseKey);
            const normalizedUnit = String(activeItem.unit || "").toLowerCase();
            const canUseTimer = [
              "min",
              "minute",
              "minutes",
              "sec",
              "seconde",
              "secondes"
            ].includes(normalizedUnit) || activeExercise?.hasTimer;

            const stepMeta = window.FitnessRpgPrograms.getProgramExerciseStepMeta?.(
              exercises,
              activeIndex
            );

            const guidedProgress = Math.round((doneCount / totalCount) * 100);

            const actionsHtml = `
              ${
                canUseTimer && !activeDone
                  ? `<button
                      class="ghost-btn start-program-exercise-timer-btn"
                      type="button"
                      data-exercise-id="${activeItem.exerciseId}"
                      data-exercise-key="${activeExerciseKey}"
                    >
                      ⏱️ Timer
                    </button>`
                  : ""
              }

              <button
                class="${activeDone ? "ghost-btn" : "secondary-btn"} validate-program-exercise-btn"
                type="button"
                data-exercise-id="${activeItem.exerciseId}"
                data-exercise-key="${activeExerciseKey}"
                ${activeDone ? "disabled" : ""}
              >
                ${
                  activeDone
                    ? "Validé"
                    : activeIndex >= totalCount - 1
                      ? "Valider le dernier exercice"
                      : "Valider et continuer"
                }
              </button>
            `;

            const exerciseCardHtml = window.FitnessRpgExercises.programExerciseCardHtml?.(
              activeItem,
              activeIndex,
              {
                done: activeDone,
                actionsHtml,
                exerciseKey: activeExerciseKey
              }
            ) || `<p class="muted">Impossible d’afficher cet exercice.</p>`;

            const exercisesHtml = `
              <div class="program-guided-progress">
                <div class="program-guided-progress-bar">
                  <span style="width: ${guidedProgress}%"></span>
                </div>
                <small>${doneCount}/${totalCount}</small>
              </div>

              <div class="program-guided-step-header">
                <p class="eyebrow">${stepMeta?.blockLabel || "⚔️ Étape"}</p>
                ${stepMeta?.cycleLabel ? `<strong>${stepMeta.cycleLabel}</strong>` : ""}
                <span>${stepMeta?.stepLabel || `Exercice ${activeIndex + 1} / ${totalCount}`}</span>
              </div>

              ${exerciseCardHtml}

              ${
                complete
                  ? `<p class="program-guided-complete-message">
                      Tous les exercices sont validés. Tu peux terminer la séance.
                    </p>`
                  : ""
              }
            `;

            const title = isBoss
              ? `${program.title} · ${workout.title}`
              : `${program.title} · Semaine ${session.weekNumber || 1} · Jour ${workout.day}`;

            const subtitle = isBoss
              ? `${workout.subtitle || ""} · ${workout.label || ""}`.replace(/^ · | · $/g, "")
              : workout.title;

            const sessionHtml = `
              <section id="activeProgramSession" class="active-program-session card">
                <p class="eyebrow">${isBoss ? "🐉 Boss en cours" : `${program.icon} Séance en cours`}</p>
                <h2>${title}</h2>
                <p>${subtitle}</p>

                <div class="program-session-meta">
                  <span>${workout.difficultyLabel || "Défi"}</span>
                  <span>${doneCount}/${totalCount} exercices</span>
                  <span>${xp} XP final</span>
                </div>

                <div class="program-session-list">
                  ${exercisesHtml}
                </div>

                <button
                  id="finishProgramSessionButton"
                  class="primary-btn"
                  type="button"
                  ${complete ? "" : "disabled"}
                >
                  ${complete ? `Terminer · +${xp} XP` : "Valide tous les exercices pour terminer"}
                </button>
              </section>
            `;

            detail.querySelector("#activeProgramSession")?.remove();
            detail.insertAdjacentHTML("afterbegin", sessionHtml);
          };'''

          replace_between(
              "app-exercises.js",
              "window.FitnessRpgExercises.exerciseCardHtml = function exerciseCardHtml(exercise) {",
              "// ============================================================\n// V3 - Mini-fiche exercice utilisée dans les programmes",
              exercise_card
          )

          replace_between(
              "app-exercises.js",
              "window.FitnessRpgExercises.programExerciseCardHtml = function programExerciseCardHtml(item, index, options = {}) {",
              "// ============================================================\n// Validation d’exercice",
              program_wrapper
          )

          replace_between(
              "app-render.js",
              "window.FitnessRpgRender.renderActiveProgramSession = function renderActiveProgramSession() {",
              "// ============================================================\n// Planning hebdomadaire",
              render_active_session
          )
          PY

      - name: Check JavaScript syntax
        run: |
          node --check app-exercises.js
          node --check app-render.js

      - name: Commit final changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-exercises.js app-render.js
          git rm .github/workflows/v54-step4-card.yml
          git commit -m "V5.4: unifier la carte exercice"
          git push origin main
