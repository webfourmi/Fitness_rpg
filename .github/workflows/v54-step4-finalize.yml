name: V5.4 Finalize Unique Exercise Card

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v54-step4-finalize.yml

permissions:
  contents: write

jobs:
  finalize-step-4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize the unique exercise card
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          exercises_path = Path("app-exercises.js")
          render_path = Path("app-render.js")

          exercises = exercises_path.read_text(encoding="utf-8")
          render = render_path.read_text(encoding="utf-8")

          wrapper = '''window.FitnessRpgExercises.programExerciseCardHtml = function programExerciseCardHtml(item, index, options = {}) {
            if (!item?.exerciseId) return "";

            const exercise = window.FitnessRpgExercises.getExercise(item.exerciseId);
            const safeExercise = exercise || {
              id: item.exerciseId,
              title: item.exerciseId,
              categoryId: "warmup",
              unit: item.unit,
              defaultValue: item.amount,
              min: 1,
              step: 1
            };

            return window.FitnessRpgExercises.exerciseCardHtml(safeExercise, {
              mode: "program",
              item,
              index,
              done: Boolean(options.done),
              actionsHtml: options.actionsHtml || "",
              exerciseKey: options.exerciseKey || `${index}-${item.exerciseId}`
            });
          };

          '''

          if exercises.count(wrapper) != 1:
              raise SystemExit("Expected exactly one programExerciseCardHtml wrapper")

          exercises = exercises.replace(wrapper, "", 1)

          old_render = '''  const exerciseCardHtml = window.FitnessRpgExercises.programExerciseCardHtml?.(
            activeItem,
            activeIndex,
            {
              done: activeDone,
              actionsHtml,
              exerciseKey: activeExerciseKey
            }
          ) || `<p class="muted">Impossible d’afficher cet exercice.</p>`;
          '''

          new_render = '''  const safeActiveExercise = activeExercise || {
            id: activeItem.exerciseId,
            title: activeItem.exerciseId,
            categoryId: "warmup",
            unit: activeItem.unit,
            defaultValue: activeItem.amount,
            min: 1,
            step: 1
          };

          const exerciseCardHtml = window.FitnessRpgExercises.exerciseCardHtml?.(
            safeActiveExercise,
            {
              mode: "program",
              item: activeItem,
              index: activeIndex,
              done: activeDone,
              actionsHtml,
              exerciseKey: activeExerciseKey
            }
          ) || `<p class="muted">Impossible d’afficher cet exercice.</p>`;
          '''

          if render.count(old_render) != 1:
              raise SystemExit("Expected exactly one program card call in app-render.js")

          render = render.replace(old_render, new_render, 1)

          if "programExerciseCardHtml" in exercises or "programExerciseCardHtml" in render:
              raise SystemExit("Legacy programExerciseCardHtml reference still present")

          if exercises.count("window.FitnessRpgExercises.exerciseCardHtml = function exerciseCardHtml") != 1:
              raise SystemExit("exerciseCardHtml must be defined exactly once")

          exercises_path.write_text(exercises, encoding="utf-8")
          render_path.write_text(render, encoding="utf-8")

          workflow_path = Path(".github/workflows/v54-step4-finalize.yml")
          workflow_path.unlink()
          PY

      - name: Check JavaScript syntax
        run: |
          node --check app-exercises.js
          node --check app-render.js

      - name: Commit final Step 4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-exercises.js app-render.js .github/workflows/v54-step4-finalize.yml
          git diff --cached --check
          git commit -m "V5.4: finaliser la carte exercice unique"
          git push
