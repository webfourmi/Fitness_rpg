<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Fitness RPG</title>
  <desc id="desc">Un bouclier doré portant un haltère bleu.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#202b44"/>
      <stop offset="0.62" stop-color="#101726"/>
      <stop offset="1" stop-color="#070a11"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe59b"/>
      <stop offset="0.52" stop-color="#f1c968"/>
      <stop offset="1" stop-color="#b87a1f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3ff"/>
      <stop offset="0.5" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#357bac"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#background)"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#f1c968" stroke-opacity="0.14" stroke-width="18"/>

  <path
    d="M256 96 391 149v105c0 91-56 157-135 190-79-33-135-99-135-190V149L256 96Z"
    fill="#111a2b"
    stroke="url(#shield)"
    stroke-width="20"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <path
    d="M256 125 363 167v87c0 70-40 124-107 157-67-33-107-87-107-157v-87l107-42Z"
    fill="#18243a"
    stroke="#ffe59b"
    stroke-opacity="0.38"
    stroke-width="4"
  />

  <g fill="url(#steel)" stroke="#07111d" stroke-width="8" stroke-linejoin="round">
    <rect x="184" y="238" width="144" height="36" rx="18"/>
    <rect x="158" y="207" width="32" height="98" rx="10"/>
    <rect x="132" y="220" width="28" height="72" rx="9"/>
    <rect x="322" y="207" width="32" height="98" rx="10"/>
    <rect x="352" y="220" width="28" height="72" rx="9"/>
  </g>

  <path d="M256 173v166" stroke="#f1c968" stroke-width="16" stroke-linecap="round"/>
  <path d="m232 198 24-45 24 45Z" fill="#ffe59b"/>
  <path d="M220 337h72" stroke="#f1c968" stroke-width="18" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="18" fill="#ffe59b" stroke="#6f4710" stroke-width="7"/>
</svg>
